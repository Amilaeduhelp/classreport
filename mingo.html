<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#9e1f63; --crimson-d:#7d1750; --crimson-l:#f6e6ef;
  --bg:#f3f3f3; --panel:#e7e8ea; --white:#fff; --grey:#85868a; --ink:#222;
  --radius:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#e9e4e8;font-family:'Noto Sans Sinhala','Noto Serif',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;border:1px solid var(--crimson)}
@media(min-width:520px){.app{height:min(900px,96dvh);margin:2dvh 0;border-radius:var(--radius)}}
.brand{font-family:'Anton',Impact,sans-serif;color:var(--crimson);letter-spacing:.5px}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;outline:none;border:0;color:var(--ink)}

/* ---------- login ---------- */
#login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;gap:14px}
#login h1{font-size:54px;text-align:center;margin-bottom:6px}
#login p.sub{text-align:center;color:var(--grey);margin-bottom:12px;font-size:14px}
.field{background:var(--panel);border-radius:999px;padding:14px 22px;width:100%}
.btn{background:var(--crimson);color:#fff;border-radius:999px;padding:14px;font-weight:600;transition:background .15s}
.btn:hover{background:var(--crimson-d)}
.btn:disabled{opacity:.6}
.err{color:var(--crimson);font-size:13px;text-align:center;min-height:18px}

/* ---------- home ---------- */
#home{flex:1;display:flex;flex-direction:column;min-height:0}
.top{padding:14px 16px 4px;text-align:center;position:relative}
.top h1{font-size:30px}
.top .me{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--grey);text-align:right;line-height:1.3;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .me button{color:var(--crimson);font-weight:600;font-size:11px}
.search{margin:8px 20px 12px;background:var(--panel);border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 18px;height:46px}
.search svg{flex:none}
.search input{background:none;flex:1;height:100%;min-width:0}
.scroll{flex:1;overflow-y:auto;padding:0 20px 20px;min-height:0}

.note{border:1px solid var(--crimson);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;background:var(--panel)}
.note-h{background:var(--crimson);color:#fff;text-align:center;font-family:'Noto Serif',serif;font-size:19px;padding:11px 12px;position:relative}
.note-h button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border-radius:999px;width:28px;height:28px;font-size:18px;line-height:1}
.note-b{height:230px;overflow-y:auto;padding:12px 16px}
.note-b .empty{color:var(--grey);text-align:center;margin-top:90px;font-size:14px}
.n-item{background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.n-author{font-family:'Anton',Impact,sans-serif;color:var(--crimson);font-size:16px;letter-spacing:.3px;display:block;margin-bottom:2px}
.n-meta{display:flex;justify-content:space-between;gap:8px;font-family:'Noto Serif',serif;font-size:11.5px;color:var(--grey);margin-top:6px}
.n-act button{color:var(--crimson);font-weight:600;margin-left:10px;font-size:12px}

.contact{background:var(--white);border-radius:999px;padding:12px 22px;margin-bottom:9px;display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.contact:active{background:var(--crimson-l)}
.dot{width:19px;height:19px;border-radius:50%;background:var(--grey);flex:none}
.contact.unread .dot{background:var(--crimson)}
.c-main{flex:1;min-width:0;display:flex;flex-direction:column}
.c-name{font-family:'Anton',Impact,sans-serif;font-size:21px;color:var(--grey);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact.unread .c-name{color:var(--crimson)}
.c-time{font-family:'Noto Serif',serif;font-size:15px;color:var(--grey);white-space:pre}
.badge{background:var(--crimson);color:#fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;font-weight:600}
.none{color:var(--grey);text-align:center;padding:24px;font-size:14px}

/* ---------- chat ---------- */
#chat{flex:1;display:flex;flex-direction:column;min-height:0;background:#efe9ee}
.chat-h{background:var(--crimson);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px}
.chat-h .back{font-size:24px;line-height:1;padding:0 6px}
.chat-h .t{font-family:'Anton',Impact,sans-serif;font-size:22px;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.day{align-self:center;background:rgba(0,0,0,.08);color:#555;font-size:11.5px;border-radius:999px;padding:3px 12px;margin:8px 0 4px;font-family:'Noto Serif',serif}
.m{max-width:80%;padding:8px 12px 6px;border-radius:18px;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.m.in{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}
.m.out{align-self:flex-end;background:var(--crimson);color:#fff;border-bottom-right-radius:5px}
.m .who{display:block;font-family:'Anton',Impact,sans-serif;font-size:14px;letter-spacing:.3px;margin-bottom:2px;opacity:.85}
.m .mt{display:flex;justify-content:flex-end;gap:8px;font-family:'Noto Serif',serif;font-size:10.5px;opacity:.7;margin-top:3px}
.m .acts{display:flex;gap:12px;margin-top:4px;justify-content:flex-end;font-size:11.5px;font-weight:600}
.m.in .acts button{color:var(--crimson)}
.m.out .acts button{color:#ffd9ea}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);align-items:flex-end}
.composer textarea{flex:1;background:#fff;border-radius:22px;padding:11px 16px;resize:none;max-height:120px;line-height:1.4}
.send{background:var(--crimson);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5}

/* ---------- modal & toast ---------- */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--bg);width:100%;border-radius:var(--radius) var(--radius) 0 0;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h3{color:var(--crimson);font-size:17px}
.sheet textarea{background:#fff;border-radius:18px;padding:12px 16px;min-height:110px;resize:vertical}
.row{display:flex;gap:10px}.row .btn{flex:1}
.btn.ghost{background:var(--panel);color:var(--ink)}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:#333;color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;z-index:20;max-width:90%;text-align:center}
.sync{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:#bbb}
.sync.on{background:var(--crimson)}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- LOGIN -->
  <section id="login">
    <h1 class="brand">Mingo</h1>
    <p class="sub">ඔබේ නමත් මුරපදයත් ඇතුළත් කරන්න</p>
    <input class="field" id="lname" placeholder="නම (Username)" autocomplete="username" autocapitalize="off">
    <input class="field" id="lpass" type="password" placeholder="මුරපදය" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn" id="lbtn">ඇතුල් වන්න</button>
  </section>

  <!-- HOME -->
  <section id="home" class="hidden">
    <div class="top">
      <span class="sync" id="sync"></span>
      <h1 class="brand">Mingo</h1>
      <div class="me"><span id="meName"></span><br><button id="logout">ඉවත් වන්න</button></div>
    </div>
    <label class="search">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="1.4"><circle cx="11" cy="11" r="8"/><line x1="17" y1="17" x2="24" y2="24"/></svg>
      <input id="q" placeholder="සොයන්න…" autocomplete="off">
    </label>
    <div class="scroll">
      <div class="note">
        <div class="note-h">Common Note<button id="addNote" title="නව සටහනක්">+</button></div>
        <div class="note-b" id="notes"></div>
      </div>
      <div id="contacts"></div>
    </div>
  </section>

  <!-- CHAT -->
  <section id="chat" class="hidden">
    <div class="chat-h"><button class="back" id="back">‹</button><span class="t" id="peerName"></span></div>
    <div class="msgs" id="msgs"></div>
    <form class="composer" id="composer">
      <textarea id="mtext" rows="1" placeholder="පණිවිඩයක් ලියන්න…" maxlength="2000"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="යවන්න">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </form>
  </section>
</div>

<script>
/* =================== CONFIG =================== */
const SUPABASE_URL  = 'https://uqgzlaxsnknheoerbfus.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ';
const REFRESH_MS = 30000;   // සෑම තත්පර 30කට වරක් නැවුම් වේ
const BAD_LOGIN  = 'නම හෝ මුරපදය වැරදියි';

/* =================== HELPERS =================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let creds = null;      // සිසුවා  {name, password, id}
let sess  = null;      // කළමනාකරු සැසිය {access, refresh, exp, email}
let peer  = null;      // විවෘත සංවාදය
let contactsCache = [], notesCache = [], msgsCache = [];
let timer = null;

async function rpc(fn, args = {}, token) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + (token || SUPABASE_ANON), 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && (data.message || data.hint)) || 'සම්බන්ධ විය නොහැක');
  return data;
}
const A = () => ({ p_name: creds.name, p_password: creds.password });

/* --- Supabase Auth (සැඟවුණු පිවිසුම) --- */
async function authCall(grant, body) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
    method: 'POST', headers: { apikey: SUPABASE_ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const d = await r.json().catch(() => null);
  if (!r.ok || !d || !d.access_token) throw new Error(BAD_LOGIN);
  return d;
}
function keepSession(d, email) {
  sess = { access: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in || 3600) * 1000, email: email || (sess && sess.email) || '' };
  try { sessionStorage.setItem('mingo_s', JSON.stringify(sess)); } catch(e){}
}
async function arpc(fn, args = {}) {
  if (Date.now() > sess.exp - 60000) {
    try { keepSession(await authCall('refresh_token', { refresh_token: sess.refresh })); }
    catch (e) { doLogout(); throw new Error('සැසිය අවසන් විය'); }
  }
  return rpc(fn, args, sess.access);
}

function pad(n){return String(n).padStart(2,'0')}
function fmtTime(d){ let h=d.getHours(), ap=h>=12?'pm':'am'; h=h%12||12; return `${pad(h)}.${pad(d.getMinutes())}${ap}`; }
function fmtDate(d){ return `${pad(d.getMonth()+1)}.${pad(d.getDate())}.${d.getFullYear()}`; }   // MM.DD.YYYY
function fmtFull(iso){ const d=new Date(iso); return `${fmtTime(d)}  ${fmtDate(d)}`; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('app').appendChild(t); setTimeout(()=>t.remove(),2600); }
function show(id){ ['login','home','chat'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }

/* =================== LOGIN =================== */
async function doLogin(name, password, silent) {
  $('lbtn').disabled = true; $('lerr').textContent = '';
  try {
    if (name.includes('@')) {                       // email එකක් නම් → Supabase Auth
      keepSession(await authCall('password', { email: name, password }), name);
      let ok = false;
      try { ok = await rpc('admin_check', {}, sess.access); } catch(e){}
      if (!ok) { sess = null; try { sessionStorage.removeItem('mingo_s'); } catch(e){} throw new Error(BAD_LOGIN); }
      creds = null;
      $('meName').textContent = '';
      $('addNote').classList.add('hidden');
    } else {                                        // සාමාන්‍ය සිසුවා
      const rows = await rpc('app_login', { p_name: name, p_password: password });
      creds = { name, password, id: rows[0].user_id }; sess = null;
      try { localStorage.setItem('mingo_cred', JSON.stringify({ name, password })); } catch(e){}
      $('meName').textContent = rows[0].user_name;
      $('addNote').classList.remove('hidden');
    }
    show('home');
    await refreshHome();
    startTimer();
  } catch (e) {
    if (!silent) $('lerr').textContent = e.message;
    try { localStorage.removeItem('mingo_cred'); sessionStorage.removeItem('mingo_s'); } catch(_){}
  } finally { $('lbtn').disabled = false; }
}
$('lbtn').onclick = () => doLogin($('lname').value.trim(), $('lpass').value);
$('lpass').addEventListener('keydown', e => { if (e.key === 'Enter') $('lbtn').click(); });

function doLogout() {
  if (sess) { fetch(`${SUPABASE_URL}/auth/v1/logout`, { method:'POST', headers:{ apikey:SUPABASE_ANON, Authorization:'Bearer '+sess.access } }).catch(()=>{}); }
  try { localStorage.removeItem('mingo_cred'); sessionStorage.removeItem('mingo_s'); } catch(e){}
  clearInterval(timer); creds = sess = peer = null; $('lpass').value = ''; $('lname').value = ''; show('login');
}
$('logout').onclick = doLogout;

/* =================== HOME =================== */
async function refreshHome() {
  $('sync').classList.add('on');
  try {
    if (sess) {
      const [t, n] = await Promise.all([ arpc('admin_threads'), arpc('admin_notes') ]);
      contactsCache = t; notesCache = n;
    } else {
      const [c, n] = await Promise.all([ rpc('app_contacts', A()), rpc('app_get_notes', A()) ]);
      contactsCache = c; notesCache = n;
    }
    renderContacts(); renderNotes();
  } catch (e) { if (creds || sess) toast(e.message); }
  setTimeout(()=>$('sync').classList.remove('on'), 600);
}

function renderNotes() {
  const box = $('notes');
  if (!notesCache.length) { box.innerHTML = '<div class="empty">පොදු දැන්වීම් නැත</div>'; return; }
  box.innerHTML = notesCache.map(n => `
    <div class="n-item"><span class="n-author">${esc(n.note_author)}</span>${esc(n.note_body)}
      <div class="n-meta"><span>${fmtFull(n.note_at)}</span>
      ${sess ? `<span class="n-act"><button data-edit="${n.note_id}">සංස්කරණය</button><button data-del="${n.note_id}">මකන්න</button></span>` : ''}</div>
    </div>`).join('');
  if (!sess) return;
  box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const n = notesCache.find(x => x.note_id == b.dataset.edit);
    openEditor('සටහන සංස්කරණය', n.note_body, async v => { await arpc('admin_edit', { p_msg_id: n.note_id, p_body: v }); refreshHome(); });
  });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('මෙම සටහන මකන්නද?')) return;
    try { await arpc('admin_delete', { p_msg_id: +b.dataset.del }); refreshHome(); } catch(e){ toast(e.message); }
  });
}

function renderContacts() {
  const q = $('q').value.trim().toLowerCase();
  let html = '';
  if (sess) {
    const list = contactsCache.filter(t => (t.t_a_name + ' ' + t.t_b_name).toLowerCase().includes(q));
    html = list.map((t, i) => `
      <button class="contact unread" data-i="${contactsCache.indexOf(t)}">
        <span class="dot"></span>
        <span class="c-main"><span class="c-name">${esc(t.t_a_name)} ↔ ${esc(t.t_b_name)}</span>
        <span class="c-time">${fmtFull(t.t_at)}</span></span>
        <span class="badge">${t.t_count}</span>
      </button>`).join('');
  } else {
    const list = contactsCache.filter(c => c.contact_name.toLowerCase().includes(q));
    html = list.map(c => `
      <button class="contact ${c.unread>0?'unread':''}" data-id="${c.contact_id}">
        <span class="dot"></span>
        <span class="c-main"><span class="c-name">${esc(c.contact_name)}</span>
        <span class="c-time">${c.last_at ? fmtFull(c.last_at) : 'පණිවිඩ නැත'}</span></span>
        ${c.unread>0?`<span class="badge">${c.unread}</span>`:''}
      </button>`).join('');
  }
  $('contacts').innerHTML = html || '<div class="none">කිසිවක් හමු නොවීය</div>';
  $('contacts').querySelectorAll('.contact').forEach(b => b.onclick = () => {
    if (sess) { const t = contactsCache[+b.dataset.i]; openChat({ a: t.t_a, b: t.t_b, an: t.t_a_name, bn: t.t_b_name }); }
    else { const c = contactsCache.find(x => x.contact_id == b.dataset.id); openChat({ id: c.contact_id, name: c.contact_name }); }
  });
}
$('q').addEventListener('input', renderContacts);

$('addNote').onclick = () => openEditor('නව පොදු දැන්වීමක්', '', async v => {
  await rpc('app_post_note', { ...A(), p_body: v }); refreshHome();
});

/* =================== CHAT =================== */
function openChat(p) {
  peer = p; msgsCache = []; $('msgs').innerHTML = '';
  $('peerName').textContent = sess ? `${p.an} ↔ ${p.bn}` : p.name;
  $('composer').classList.toggle('hidden', !!sess);
  show('chat'); loadMessages(true);
  if (!sess) $('mtext').focus();
}
$('back').onclick = () => { peer = null; show('home'); refreshHome(); };

async function loadMessages(scrollDown) {
  if (!peer) return;
  try {
    msgsCache = sess ? await arpc('admin_thread', { p_a: peer.a, p_b: peer.b })
                     : await rpc('app_get_messages', { ...A(), p_peer: peer.id });
    renderMessages(scrollDown);
  } catch (e) { toast(e.message); }
}

function renderMessages(forceScroll) {
  const box = $('msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  let html = '', lastDay = '';
  for (const m of msgsCache) {
    const d = new Date(m.msg_at), day = fmtDate(d);
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    const side = sess ? (m.msg_sender === peer.a ? 'in' : 'out') : (m.msg_sender === creds.id ? 'out' : 'in');
    html += `<div class="m ${side}">${sess ? `<span class="who">${esc(m.msg_sender_name)}</span>` : ''}${esc(m.msg_body)}
      <div class="mt"><span>${fmtTime(d)}</span>${!sess && side==='out' && m.msg_read ? '<span>✓✓</span>' : ''}</div>
      ${sess ? `<div class="acts"><button data-e="${m.msg_id}">සංස්කරණය</button><button data-d="${m.msg_id}">මකන්න</button></div>` : ''}</div>`;
  }
  box.innerHTML = html || '<div class="day">පණිවිඩ නැත</div>';
  if (sess) {
    box.querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
      const m = msgsCache.find(x => x.msg_id == b.dataset.e);
      openEditor('පණිවිඩය සංස්කරණය', m.msg_body, async v => { await arpc('admin_edit', { p_msg_id: m.msg_id, p_body: v }); loadMessages(); });
    });
    box.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
      if (!confirm('මෙම පණිවිඩය මකන්නද?')) return;
      try { await arpc('admin_delete', { p_msg_id: +b.dataset.d }); loadMessages(); } catch(e){ toast(e.message); }
    });
  }
  if (forceScroll || atBottom) box.scrollTop = box.scrollHeight;
}

$('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const body = $('mtext').value.trim(); if (!body || !peer || !creds) return;
  $('sendBtn').disabled = true;
  try {
    await rpc('app_send', { ...A(), p_peer: peer.id, p_body: body });
    $('mtext').value = ''; $('mtext').style.height = 'auto';
    await loadMessages(true);
  } catch (err) { toast(err.message); }
  $('sendBtn').disabled = false;
});
$('mtext').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
$('mtext').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey && window.innerWidth>700) { e.preventDefault(); $('composer').requestSubmit(); } });

/* =================== EDITOR MODAL =================== */
function openEditor(title, initial, onSave) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3><textarea maxlength="2000"></textarea>
    <div class="row"><button class="btn ghost" type="button">අවලංගු</button><button class="btn" type="button">සුරකින්න</button></div></div>`;
  const ta = m.querySelector('textarea'); ta.value = initial;
  const [cancel, save] = m.querySelectorAll('button');
  cancel.onclick = () => m.remove();
  save.onclick = async () => {
    const v = ta.value.trim(); if (!v) return;
    save.disabled = true;
    try { await onSave(v); m.remove(); } catch (e) { toast(e.message); save.disabled = false; }
  };
  $('app').appendChild(m); ta.focus();
}

/* =================== AUTO REFRESH (30s) =================== */
function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => {
    if ((!creds && !sess) || document.hidden) return;
    if (peer) loadMessages(); else refreshHome();
  }, REFRESH_MS);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (creds || sess)) { peer ? loadMessages() : refreshHome(); }
});

/* =================== BOOT =================== */
(async function boot(){
  try {
    const s = JSON.parse(sessionStorage.getItem('mingo_s') || 'null');
    if (s && s.refresh) {
      sess = s;
      let ok = false;
      try { ok = await arpc('admin_check'); } catch(e){}
      if (ok) { creds = null; $('addNote').classList.add('hidden'); show('home'); await refreshHome(); startTimer(); return; }
      sess = null; sessionStorage.removeItem('mingo_s');
    }
    const c = JSON.parse(localStorage.getItem('mingo_cred') || 'null');
    if (c && c.name) doLogin(c.name, c.password, true);
  } catch(e){}
})();
</script>
